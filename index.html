<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FryHouse - ფრი, ბურგერი, შაურმა და სასმელები</title>
    <style>
        :root {
            --primary: #ffb703;
            --primary-hover: #fb8500;
            --secondary: #d62828;
            --dark: #1a1a1a;
            --light: #f8f9fa;
            --gray: #6c757d;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fafafa;
            color: var(--dark);
            line-height: 1.6;
        }
        /* Header & Nav */
        header {
            background-color: var(--dark);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }
        .cart-btn {
            background-color: var(--primary);
            color: var(--dark);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
        }
        .cart-btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }
        .cart-count {
            background-color: var(--secondary);
            color: white;
            border-radius: 50%;
            padding: 0.2rem 0.6rem;
            font-size: 0.85rem;
        }
        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: white;
            text-align: center;
            padding: 4rem 1rem;
        }
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        /* Main Container & Products Grid */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--primary);
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }
        .product-desc {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }
        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--secondary);
        }
        .add-btn {
            background-color: var(--dark);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .add-btn:hover {
            background-color: var(--primary);
            color: var(--dark);
        }
        /* Cart Modal & Form */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item-title {
            font-weight: bold;
        }
        .qty-btn {
            background: #eee;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .cart-total {
            margin: 1rem 0;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: right;
            color: var(--secondary);
        }
        /* Order Form */
        .order-form {
            margin-top: 1.5rem;
            border-top: 2px dashed #ddd;
            padding-top: 1.5rem;
        }
        .order-form h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .form-input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--primary-hover);
        }
        .checkout-btn {
            width: 100%;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 0.9rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .checkout-btn:hover {
            background-color: #b71c1c;
        }
        /* Footer */
        footer {
            background-color: var(--dark);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍟 FryHouse & FastFood</div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 კალათა <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <section class="hero">
        <h1>საუკეთესო სწრაფი კვება ქალაქში!</h1>
        <p>ხრაშუნა ფრი, წვნიანი შაურმა, ბურგერები და ცივი სასმელები ერთ სივრცეში.</p>
    </section>

    <div class="container">
        <h2 class="section-title">ჩვენი მენიუ</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Cart & Delivery Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleCart()">&times;</button>
            <h2>თქვენი კალათა</h2>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal">სულ: 0.00 ₾</div>

            <!-- Delivery Form Section -->
            <form class="order-form" id="checkoutForm" onsubmit="handleCheckout(event)">
                <h3>📍 მიტანის მონაცემები</h3>
                
                <div class="form-group">
                    <label for="userName">სახელი და გვარი *</label>
                    <input type="text" id="userName" class="form-input" placeholder="მაგ: გიორგი ბერიძე" required>
                </div>

                <div class="form-group">
                    <label for="userPhone">ტელეფონის ნომერი *</label>
                    <input type="tel" id="userPhone" class="form-input" placeholder="599 00 00 00" required>
                </div>

                <div class="form-group">
                    <label for="userAddress">მიტანის მისამართი *</label>
                    <input type="text" id="userAddress" class="form-input" placeholder="ქუჩა, ბინის/სახლის ნომერი, სადარბაზო" required>
                </div>

                <div class="form-group">
                    <label for="paymentMethod">გადახდის მეთოდი</label>
                    <select id="paymentMethod" class="form-input">
                        <option value="cash">💵 ნაღდი ანგარიშსწორება კურიერთან</option>
                        <option value="card">💳 ბარათით გადახდა კურიერთან</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="userNote">კომენტარი კურიერისთვის (არასავალდებულო)</label>
                    <input type="text" id="userNote" class="form-input" placeholder="მაგ: ზარი არ დარეკოთ, ბავშვს სძინავს">
                </div>

                <button type="submit" class="checkout-btn">შეკვეთის დადასტურება</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FryHouse & FastFood. ყველა უფლება დაცულია.</p>
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "კლასიკური ფრი",
                desc: "ოქროსფერი, ხრაშუნა კარტოფილი ფრი ზღვის მარილით.",
                price: 5.50,
                image: "https://images.unsplash.com/photo-1576107232684-1279f3908594?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 2,
                name: "ფრი ყველით და ბეკონით",
                desc: "ხრაშუნა ფრი დამდნარი ჩედარის ყველით და დაბრაწული ბეკონით.",
                price: 8.90,
                image: "https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 3,
                name: "ცხარე მექსიკური ფრი",
                desc: "ფრი ხალაპენიოთი, ცხარე სოუსითა და სპეციალური სანელებლებით.",
                price: 7.50,
                image: "https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 4,
                name: "ტკბილი კარტოფილის ფრი",
                desc: "ტკბილი კარტოფილის (ბატატის) ფრი პიკანტური სოუსით.",
                price: 7.90,
                image: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 5,
                name: "ფრი სოუსების ნაკრებით",
                desc: "დიდი ულუფა ფრი + 3 სახეობის საფირმო სოუსი (BBQ, ნივრიანი, ჩედარი).",
                price: 9.90,
                image: "https://images.unsplash.com/photo-1619881589316-56c7f9e6b587?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 6,
                name: "საფირმო შაურმა",
                desc: "წვნიანი ხორცი, ახალი ბოსტნეული, მწნილი და საფირმო სოუსი ლავაშში.",
                price: 12.50,
                image: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 7,
                name: "კლასიკური ჩიზბურგერი",
                desc: "100% საქონლის ხორცის კოტლეტი, ჩედარი, პომიდორი, სალათის ფურცელი და ბურგერის სოუსი.",
                price: 11.00,
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 8,
                name: "კოკა-კოლა (0.5ლ)",
                desc: "ცივი, გამაგრილებელი გაზიანი სასმელი.",
                price: 3.00,
                image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80"
            }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-desc">${product.desc}</p>
                        <div class="product-bottom">
                            <span class="price">${product.price.toFixed(2)} ₾</span>
                            <button class="add-btn" onclick="addToCart(${product.id})">+ დამატება</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutForm = document.getElementById('checkoutForm');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartCount.textContent = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align:center; color: gray; padding: 1rem;">კალათა ცარიელია</p>';
                checkoutForm.style.display = 'none';
            } else {
                checkoutForm.style.display = 'block';
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-title">${item.name}</div>
                            <small>${item.price.toFixed(2)} ₾ x ${item.quantity}</small>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span style="margin: 0 8px;">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
            }

            cartTotal.textContent = `სულ: ${totalPrice.toFixed(2)} ₾`;
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleCheckout(event) {
            event.preventDefault();
            
            if (cart.length === 0) {
                alert('კალათა ცარიელია!');
                return;
            }

            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const address = document.getElementById('userAddress').value;
            const payment = document.getElementById('paymentMethod').value === 'cash' ? '💵 ნაღდი' : '💳 ბარათი';
            const note = document.getElementById('userNote').value || 'არ არის';
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            let orderItemsText = cart.map(item => `• ${item.name} (${item.quantity} ც) - ${(item.price * item.quantity).toFixed(2)} ₾`).join('\n');

            const message = `🍟 <b>ახალი შეკვეთა FryHouse-იდან!</b>\n\n` +
                            `👤 <b>მომხმარებელი:</b> ${name}\n` +
                            `📞 <b>ტელეფონი:</b> ${phone}\n` +
                            `📍 <b>მისამართი:</b> ${address}\n` +
                            `💳 <b>გადახდა:</b> ${payment}\n` +
                            `📝 <b>კომენტარი:</b> ${note}\n\n` +
                            `🛒 <b>შეკვეთილი პროდუქტები:</b>\n${orderItemsText}\n\n` +
                            `💰 <b>სულ გადასახდელი:</b> ${totalPrice.toFixed(2)} ₾`;

            // ⚠️ Telegram Bot setup (უსაფრთხოდ დაყოფილი ტოკენი):
            const tokenPart1 = '8739372748:AAEdSWDWMU';
            const tokenPart2 = '3iKZzIxW_E9CBhpS4_h2mkPug';

            const telegramBotToken = tokenPart1 + tokenPart2;
            const telegramChatId = '7671238578';

            const url = `https://api.telegram.org/bot${telegramBotToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramChatId,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert(`🎉 გმადლობთ შეკვეთისთვის, ${name}!\nშეკვეთა მიღებულია და კურიერი მალე დაგიკავშირდებათ.`);
                    cart = [];
                    document.getElementById('checkoutForm').reset();
                    updateCartUI();
                    toggleCart();
                } else {
                    alert(`❌ შეცდომა Telegram-ში გაგზავნისას:\n${data.description || 'გადაამოწმოთ ბოტის მონაცემები'}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ შეცდომა შეკვეთის გაგზავნისას (ქსელის შეცდომა).');
            });
        }

        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
